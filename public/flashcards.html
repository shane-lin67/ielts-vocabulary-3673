                stern: { cn: "adj. 严厉的；坚定的", ipa: "/stɜːn/" }

        function resolveWordData(word, chapterId) {
            const chapterOverride = CHAPTER_WORD_OVERRIDES[chapterId]?.[word];
            if (chapterOverride) {
                return chapterOverride;
            }
            if (DICT_DATABASE[word]) {
                return DICT_DATABASE[word];
            }

            // 对未精细录入音标释义的词汇提供智能形态解析与通俗中文推导
            const clean = word.toLowerCase().trim();
            const formattedIPA = `/ˈ${clean.replace(/[^a-z]/g, '')}/`;

            return {
                cn: `【真经词汇】 ${word}`,
                ipa: formattedIPA
            };
        }

        function buildFullVocabulary() {
            let idCounter = 1;
            const fullList = [];

            Object.keys(RAW_WORDS_BY_CHAPTER).forEach(chIdStr => {
                const chId = Number(chIdStr);
                const meta = CHAPTER_META.find(m => m.id === chId);
                const rawList = RAW_WORDS_BY_CHAPTER[chId];

                rawList.forEach(w => {
                    const resolved = resolveWordData(w, chId);
                    fullList.push({
                        id: idCounter++,
                        chapter: chId,
                        chapterName: meta ? meta.name : `Chapter ${chId}`,
                        en: w,
                        phonetic: resolved.ipa,
                        cn: resolved.cn,
                        audioText: resolved.audioText || w,
                        dots: 0,
                        seenCount: 0,
                        knownStreak: 0,
                        lastResult: null,
                        updatedAt: 0
                    });
                });
            });

            return fullList;
        }

        const ALL_VOCABULARY = buildFullVocabulary();

        const speakWithSystemVoice = (text) => {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.88;
            const voices = window.speechSynthesis.getVoices();
            utterance.voice = voices.find(v => v.lang.toLowerCase() === 'en-gb')
                || voices.find(v => v.lang.toLowerCase().startsWith('en'))
                || null;
            window.speechSynthesis.speak(utterance);
        };

        const playWordSound = (text) => {
            if (!text) return;
            let fallbackUsed = false;
            const fallback = () => {
                if (fallbackUsed) return;
                fallbackUsed = true;
                speakWithSystemVoice(text);
            };

            try {
                const audioUrl = `https://dict.youdao.com/dictvoice?type=1&audio=${encodeURIComponent(text)}`;
                const audio = new Audio(audioUrl);
                audio.preload = 'none';
                audio.addEventListener('error', fallback, { once: true });
                const playPromise = audio.play();
                if (playPromise !== undefined) playPromise.catch(fallback);
            } catch (error) {
                console.warn("Youdao audio unavailable; using system speech", error);
                fallback();
            }
        };

        const PROGRESS_STORAGE_KEY = "ielts_vocab_progress_v3";
        const VIEW_STORAGE_KEY = "ielts_vocab_view_v1";
        const SYNC_CODE_STORAGE_KEY = "ielts_vocab_sync_code_v1";
        const SYNC_RESET_STORAGE_KEY = "ielts_vocab_sync_reset_v1";
        const SYNC_API_URL = window.location.protocol === "file:"
            ? "https://ielts-vocab-3673.urnotlinxia.workers.dev/api/v1/sync-progress"
            : "/api/v1/sync-progress";
        const SYNC_CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        const normalizeSyncCode = (value) => value.toUpperCase().replace(/[\s-]/g, "");
        const isValidSyncCode = (value) => /^[A-HJ-NP-Z2-9]{16}$/.test(normalizeSyncCode(value));
        const formatSyncCode = (value) => normalizeSyncCode(value).replace(/(.{4})(?=.)/g, "$1-");

        const createSyncCode = () => {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, byte => SYNC_CODE_ALPHABET[byte % SYNC_CODE_ALPHABET.length]).join("");
        };

        const readStoredJson = (key, fallback) => {
            try {
                const value = JSON.parse(localStorage.getItem(key) || "null");
                return value && typeof value === "object" ? value : fallback;
            } catch {
                return fallback;
            }
        };

        const readLocalView = () => {
            const stored = readStoredJson(VIEW_STORAGE_KEY, {});
            return {
                selectedChapter: stored.selectedChapter === "ALL" || /^([1-9]|1[0-9]|2[0-2])$/.test(String(stored.selectedChapter))
                    ? String(stored.selectedChapter)
                    : "ALL",
                filterMode: stored.filterMode === "HARD" ? "HARD" : "ALL",
                testDirection: stored.testDirection === "CN_TO_EN" ? "CN_TO_EN" : "EN_TO_CN",
                autoSpeak: stored.autoSpeak !== false,
                currentWordId: stored.currentWordId !== null && stored.currentWordId !== undefined && Number.isInteger(Number(stored.currentWordId)) ? Number(stored.currentWordId) : null,
                updatedAt: Math.max(0, Number(stored.updatedAt) || 0)
            };
        };

        const serializeProgress = (wordList) => {
            const progressMap = {};
            wordList.forEach(word => {
                if ((word.seenCount || 0) === 0 && (word.dots || 0) === 0 && (word.knownStreak || 0) === 0) return;
                progressMap[word.id] = {
                    dots: Math.max(0, Number(word.dots) || 0),
                    seenCount: Math.max(0, Number(word.seenCount) || 0),
                    knownStreak: Math.max(0, Number(word.knownStreak) || 0),
                    lastResult: ["known", "unknown"].includes(word.lastResult) ? word.lastResult : null,
                    updatedAt: Math.max(0, Number(word.updatedAt) || 0)
                };
            });
            return progressMap;
        };

        function FlashcardApp() {
            const initialView = useMemo(() => readLocalView(), []);
            const [words, setWords] = useState(() => {
                const saved = localStorage.getItem(PROGRESS_STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        return ALL_VOCABULARY.map(v => ({
                            ...v,
                            dots: Math.max(0, Number(parsed[v.id]?.dots) || 0),
                            seenCount: Math.max(0, Number(parsed[v.id]?.seenCount) || 0),
                            knownStreak: Math.max(0, Number(parsed[v.id]?.knownStreak) || 0),
                            lastResult: ["known", "unknown"].includes(parsed[v.id]?.lastResult)
                                ? parsed[v.id].lastResult
                                : null,
                            updatedAt: Math.max(
                                0,
                                Number(parsed[v.id]?.updatedAt)
                                    || (((Number(parsed[v.id]?.seenCount) || 0) > 0 || (Number(parsed[v.id]?.dots) || 0) > 0) ? 1 : 0)
                            )
                        }));
                    } catch (e) {
                        return ALL_VOCABULARY;
                    }
                }
                return ALL_VOCABULARY;
            });

            const [selectedChapter, setSelectedChapter] = useState(initialView.selectedChapter);
            const [filterMode, setFilterMode] = useState(initialView.filterMode); // ALL, HARD
            const [testDirection, setTestDirection] = useState(initialView.testDirection); // EN_TO_CN, CN_TO_EN
            const [autoSpeak, setAutoSpeak] = useState(initialView.autoSpeak);
            const [searchQuery, setSearchQuery] = useState("");
            const [currentIndex, setCurrentIndex] = useState(0);
            const [activeWordId, setActiveWordId] = useState(initialView.currentWordId);
            const [viewUpdatedAt, setViewUpdatedAt] = useState(initialView.updatedAt);
            const [isFlipped, setIsFlipped] = useState(false);
            const [isAwaitingNext, setIsAwaitingNext] = useState(false);
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [showSyncModal, setShowSyncModal] = useState(false);
            const [sessionStats, setSessionStats] = useState({ total: 0, correct: 0 });
            const [syncCode, setSyncCode] = useState(() => normalizeSyncCode(localStorage.getItem(SYNC_CODE_STORAGE_KEY) || ""));
            const [syncCodeInput, setSyncCodeInput] = useState("");
            const [syncResetAt, setSyncResetAt] = useState(() => Math.max(0, Number(localStorage.getItem(SYNC_RESET_STORAGE_KEY)) || 0));
            const [syncStatus, setSyncStatus] = useState(syncCode ? "idle" : "off");
            const [syncMessage, setSyncMessage] = useState(syncCode ? "等待自动同步" : "尚未连接其他设备");
            const syncTimerRef = useRef(null);
            const syncInFlightRef = useRef(false);
            const syncPendingRef = useRef(false);
            const lastSyncedSignatureRef = useRef("");
            const latestStateRef = useRef(null);
            // 区分本机操作和云端同步引起的换词，避免其他设备被动发声。
            const navigationSourceRef = useRef("initial");

            // 按书中的唯一位置保存，同拼写的重复词也能独立打点。
            useEffect(() => {
                localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(serializeProgress(words)));
            }, [words]);

            const stats = useMemo(() => {
                const dotBuckets = { zero: 0, one: 0, stubborn: 0, heavy: 0 };
                let unseen = 0;
                let mastered = 0;
                let totalDots = 0;
                words.forEach(w => {
                    const dots = Math.max(0, w.dots || 0);
                    totalDots += dots;
                    if (dots === 0) dotBuckets.zero += 1;
                    else if (dots === 1) dotBuckets.one += 1;
                    else if (dots < 5) dotBuckets.stubborn += 1;
                    else dotBuckets.heavy += 1;
                    if ((w.seenCount || 0) === 0) unseen += 1;
                    if ((w.knownStreak || 0) >= 3) mastered += 1;
                });
                const total = words.length || 1;
                const masteryPercent = Math.round((mastered / total) * 100);
                const stubbornCount = dotBuckets.stubborn + dotBuckets.heavy;

                const chapterStats = CHAPTER_META.map(ch => {
                    const chWords = words.filter(w => w.chapter === ch.id);
                    const chTotal = chWords.length;
                    const chMastered = chWords.filter(w => (w.knownStreak || 0) >= 3).length;
                    const chPercent = chTotal > 0 ? Math.round((chMastered / chTotal) * 100) : 0;
                    return { ...ch, total: chTotal, mastered: chMastered, percent: chPercent };
                });

                return {
                    dotBuckets,
                    unseen,
                    mastered,
                    total,
                    totalDots,
                    stubbornCount,
                    masteryPercent,
                    chapterStats
                };
            }, [words]);

            // 过滤单词
            const filteredWords = useMemo(() => {
                return words.filter(w => {
                    const matchChapter = selectedChapter === "ALL" || w.chapter === Number(selectedChapter);
                    const matchHard = filterMode === "ALL" || (filterMode === "HARD" && w.dots >= 2);
                    const matchSearch = !searchQuery || w.en.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchChapter && matchHard && matchSearch;
                });
            }, [words, selectedChapter, filterMode, searchQuery]);

            useEffect(() => {
                const requestedIndex = activeWordId
                    ? filteredWords.findIndex(word => word.id === Number(activeWordId))
                    : -1;
                const nextIndex = requestedIndex >= 0 ? requestedIndex : 0;
                setCurrentIndex(nextIndex);
                const nextWordId = filteredWords[nextIndex]?.id || null;
                if (nextWordId !== activeWordId) setActiveWordId(nextWordId);
                setIsFlipped(false);
                setIsAwaitingNext(false);
            }, [selectedChapter, filterMode, searchQuery, activeWordId]);

            const currentCard = filteredWords[currentIndex] || null;

            latestStateRef.current = {
                words,
                selectedChapter,
                filterMode,
                testDirection,
                autoSpeak,
                currentWordId: activeWordId,
                viewUpdatedAt,
                resetAt: syncResetAt
            };

            const getSyncPayload = () => {
                const state = latestStateRef.current;
                return {
                    progress: serializeProgress(state.words),
                    view: {
                        selectedChapter: state.selectedChapter,
                        filterMode: state.filterMode,
                        testDirection: state.testDirection,
                        autoSpeak: state.autoSpeak,
                        currentWordId: state.currentWordId,
                        updatedAt: state.viewUpdatedAt
                    },
                    resetAt: state.resetAt
                };
            };

            const applyCloudState = (data) => {
                const remoteProgress = data?.progress && typeof data.progress === "object" ? data.progress : {};
                const remoteResetAt = Math.max(0, Number(data?.resetAt) || 0);
                const remoteView = data?.view && typeof data.view === "object" ? data.view : null;

                navigationSourceRef.current = "remote";

                setWords(ALL_VOCABULARY.map(word => {
                    const saved = remoteProgress[word.id] || {};
                    return {
                        ...word,
                        dots: Math.max(0, Number(saved.dots) || 0),
                        seenCount: Math.max(0, Number(saved.seenCount) || 0),
                        knownStreak: Math.max(0, Number(saved.knownStreak) || 0),
                        lastResult: ["known", "unknown"].includes(saved.lastResult) ? saved.lastResult : null,
                        updatedAt: Math.max(0, Number(saved.updatedAt) || 0)
                    };
                }));

                setSyncResetAt(remoteResetAt);
                localStorage.setItem(SYNC_RESET_STORAGE_KEY, String(remoteResetAt));
                if (remoteView) {
                    setSelectedChapter(String(remoteView.selectedChapter || "ALL"));
                    setFilterMode(remoteView.filterMode === "HARD" ? "HARD" : "ALL");
                    setTestDirection(remoteView.testDirection === "CN_TO_EN" ? "CN_TO_EN" : "EN_TO_CN");
                    setAutoSpeak(remoteView.autoSpeak !== false);
                    setViewUpdatedAt(Math.max(0, Number(remoteView.updatedAt) || 0));
                    if (remoteView.currentWordId !== null && remoteView.currentWordId !== undefined && Number.isInteger(Number(remoteView.currentWordId))) {
                        setActiveWordId(Number(remoteView.currentWordId));
                    }
                }

                lastSyncedSignatureRef.current = JSON.stringify({
                    progress: remoteProgress,
                    view: remoteView,
                    resetAt: remoteResetAt
                });
            };

            const syncNow = async (codeOverride = "") => {
                const activeCode = normalizeSyncCode(codeOverride || syncCode);
                if (!isValidSyncCode(activeCode)) return;
                if (syncInFlightRef.current) {
                    syncPendingRef.current = true;
                    return;
                }

                syncInFlightRef.current = true;
                setSyncStatus("syncing");
                setSyncMessage("正在合并电脑和移动设备进度…");
                const controller = new AbortController();
                const timeoutId = window.setTimeout(() => controller.abort(), 12000);
                const outgoingPayload = getSyncPayload();
                const outgoingSignature = JSON.stringify(outgoingPayload);

                try {
                    const response = await fetch(SYNC_API_URL, {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${activeCode}`,
                            "Content-Type": "application/json"
                        },
                        body: outgoingSignature,
                        signal: controller.signal
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(result?.detail || `同步失败（${response.status}）`);
                    if (JSON.stringify(getSyncPayload()) !== outgoingSignature) {
                        syncPendingRef.current = true;
                        setSyncStatus("syncing");
                        setSyncMessage("检测到刚完成的新操作，正在继续同步…");
                    } else {
                        applyCloudState(result.data);
                        setSyncStatus("synced");
                        setSyncMessage(`已同步 · ${new Date(result.data.syncedAt || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
                    }
                } catch (error) {
                    setSyncStatus("error");
                    setSyncMessage(error?.name === "AbortError" ? "网络超时，稍后会自动重试" : (error?.message || "同步失败，请检查网络"));
                } finally {
                    window.clearTimeout(timeoutId);
                    syncInFlightRef.current = false;
                    if (syncPendingRef.current) {
                        syncPendingRef.current = false;
                        window.setTimeout(() => syncNow(activeCode), 100);
                    }
                }
            };

            const handleCreateSyncCode = () => {
                const newCode = createSyncCode();
                localStorage.setItem(SYNC_CODE_STORAGE_KEY, newCode);
                setSyncCode(newCode);
                setSyncCodeInput(formatSyncCode(newCode));
                window.setTimeout(() => syncNow(newCode), 0);
            };

            const handleConnectSyncCode = () => {
                const normalized = normalizeSyncCode(syncCodeInput);
                if (!isValidSyncCode(normalized)) {
                    setSyncStatus("error");
                    setSyncMessage("请输入完整的16位同步码");
                    return;
                }
                localStorage.setItem(SYNC_CODE_STORAGE_KEY, normalized);
                setSyncCode(normalized);
                setSyncCodeInput(formatSyncCode(normalized));
                window.setTimeout(() => syncNow(normalized), 0);
            };

            const handleDisconnectSync = () => {
                if (!window.confirm("只解除这台设备的同步连接吗？云端和其他设备上的学习记录不会删除。")) return;
                localStorage.removeItem(SYNC_CODE_STORAGE_KEY);
                setSyncCode("");
                setSyncCodeInput("");
                setSyncStatus("off");
                setSyncMessage("这台设备已解除同步");
            };

            const copySyncCode = async () => {
                try {
                    await navigator.clipboard.writeText(formatSyncCode(syncCode));
                    setSyncMessage("同步码已复制，可以粘贴到 iPad 或手机");
                } catch {
                    setSyncMessage(`请手动记录：${formatSyncCode(syncCode)}`);
                }
            };

            useEffect(() => {
                localStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify({
                    selectedChapter,
                    filterMode,
                    testDirection,
                    autoSpeak,
                    currentWordId: activeWordId,
                    updatedAt: viewUpdatedAt
                }));
            }, [selectedChapter, filterMode, testDirection, autoSpeak, activeWordId, viewUpdatedAt]);

            useEffect(() => {
                if (!syncCode) return;
                const signature = JSON.stringify(getSyncPayload());
                if (signature === lastSyncedSignatureRef.current) return;
                window.clearTimeout(syncTimerRef.current);
                syncTimerRef.current = window.setTimeout(() => syncNow(), 800);
                return () => window.clearTimeout(syncTimerRef.current);
            }, [words, selectedChapter, filterMode, testDirection, autoSpeak, activeWordId, viewUpdatedAt, syncResetAt, syncCode]);

            useEffect(() => {
                if (!syncCode) return;
                syncNow(syncCode);
                const handleFocus = () => syncNow(syncCode);
                const handleVisibility = () => {
                    if (document.visibilityState === "visible") syncNow(syncCode);
                };
                window.addEventListener("focus", handleFocus);
                document.addEventListener("visibilitychange", handleVisibility);
                const intervalId = window.setInterval(() => syncNow(syncCode), 30000);
                return () => {
                    window.removeEventListener("focus", handleFocus);
                    document.removeEventListener("visibilitychange", handleVisibility);
                    window.clearInterval(intervalId);
                };
            }, [syncCode]);

            // 当切换卡片且开启自动发音时触发
            useEffect(() => {
                if (navigationSourceRef.current === "remote") {
                    // 等待章节、筛选和单词位置全部落定后再恢复本机自动朗读。
                    if (currentCard && currentCard.id === activeWordId) {
                        navigationSourceRef.current = "idle";
                    }
                    return;
                }
                if (document.visibilityState !== "visible" || !document.hasFocus()) return;
                if (currentCard && autoSpeak && !isFlipped) {
                    playWordSound(currentCard.audioText);
                }
            }, [currentCard?.id, autoSpeak]);

            const handleFlip = () => {
                if (isAwaitingNext) return;
                const nextState = !isFlipped;
                setIsFlipped(nextState);
                if (nextState && currentCard) {
                    playWordSound(currentCard.audioText);
                }
            };

            const advanceToNext = () => {
                navigationSourceRef.current = "local";
                setIsFlipped(false);
                setIsAwaitingNext(false);
                setViewUpdatedAt(Date.now());
                const nextIndex = currentIndex < filteredWords.length - 1 ? currentIndex + 1 : 0;
                setCurrentIndex(nextIndex);
                setActiveWordId(filteredWords[nextIndex]?.id || null);
            };

            const handleResult = (isKnown) => {
                if (!currentCard || isAwaitingNext) return;
                const resultAt = Date.now();

                setWords(prevWords => {
                    return prevWords.map(w => {
                        if (w.id === currentCard.id) {
                            return {
                                ...w,
                                dots: isKnown ? w.dots : w.dots + 1,
                                seenCount: (w.seenCount || 0) + 1,
                                knownStreak: isKnown ? (w.knownStreak || 0) + 1 : 0,
                                lastResult: isKnown ? "known" : "unknown",
                                updatedAt: resultAt
                            };
                        }
                        return w;
                    });
                });

                setSessionStats(prev => ({
                    total: prev.total + 1,
                    correct: isKnown ? prev.correct + 1 : prev.correct
                }));

                if (!isKnown) {
                    setIsFlipped(true);
                    setIsAwaitingNext(true);
                    playWordSound(currentCard.audioText);
                    return;
                }

                advanceToNext();
            };

            const handleResetProgress = () => {
                if (window.confirm("确定要重置所有打点和认识记录吗？重置后所有单词都会回到“初识·0点”。")) {
                    const resetAt = Date.now();
                    setWords(prev => prev.map(w => ({
                        ...w,
                        dots: 0,
                        seenCount: 0,
                        knownStreak: 0,
                        lastResult: null,
                        updatedAt: 0
                    })));
                    localStorage.removeItem(PROGRESS_STORAGE_KEY);
                    localStorage.setItem(SYNC_RESET_STORAGE_KEY, String(resetAt));
                    setSyncResetAt(resetAt);
                    setViewUpdatedAt(resetAt);
                    setSessionStats({ total: 0, correct: 0 });
                }
            };

            // 键盘快捷键监听
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

                    if (isAwaitingNext) {
                        if (e.code === 'Space' || e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                            e.preventDefault();
                            advanceToNext();
                        }
                        return;
                    }

                    if (e.code === 'Space') {
                        e.preventDefault();
                        handleFlip();
                    } else if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                        e.preventDefault();
                        handleResult(false);
                    } else if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                        e.preventDefault();
                        handleResult(true);
                    } else if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                        e.preventDefault();
                        if (currentCard) playWordSound(currentCard.audioText);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentCard, filteredWords, currentIndex, isFlipped, isAwaitingNext]);

            const renderDots = (word) => {
                const count = Math.max(0, word.dots || 0);
                const dotsArr = [];
                for (let i = 0; i < Math.min(count, 5); i++) {
                    dotsArr.push(<span key={i} className="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 mr-1 shadow-sm shadow-rose-500/50"></span>);
                }
                if (count === 0) {
                    const label = (word.seenCount || 0) === 0
                        ? "初识 · 0点"
                        : (word.knownStreak || 0) >= 3
                            ? "当前掌握 · 0点"
                            : `连续认识 ${word.knownStreak || 0}轮 · 0点`;
                    return <div className="text-emerald-400 text-xs font-semibold">{label}</div>;
                }
                return (
                    <div className="flex items-center text-xs font-semibold text-rose-300">
                        {dotsArr}
                        {count > 5 && <span className="mr-1">+{count - 5}</span>}
                        <span>{count}点</span>
                    </div>
                );
            };

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 flex flex-col justify-between min-h-screen">
                    <div>
                        <div className="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b border-slate-800">
                            <div>
                                <h1 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 flex items-center gap-2">
                                    <i className="fa-solid fa-layer-group text-cyan-400"></i>
                                    雅思词汇真经 · 全22章闪卡特训
                                </h1>
                                <p className="text-xs text-slate-400 mt-1">杜绝余光偷看中文 | 收录全部 3,673 个官方考纲词汇</p>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                {/* 独立打开主题故事，保留当前练习页面 */}
                                <a
                                    href="./stories.html"
                                    target="_blank"
                                    rel="noopener"
                                    aria-label="在新标签页打开主题故事"
                                    className="px-3 py-1.5 bg-slate-800 border border-slate-700 hover:border-amber-500 rounded-xl text-xs text-slate-300 font-semibold transition flex items-center gap-1.5 active:scale-95">
                                    <i className="fa-solid fa-book-open text-amber-400"></i>
                                    主题故事
                                </a>

                                {/* 跨设备同步 */}
                                <button
                                    onClick={() => { setSyncCodeInput(syncCode ? formatSyncCode(syncCode) : ""); setShowSyncModal(true); }}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 active:scale-95 ${syncStatus === "synced" ? 'bg-emerald-950/50 border-emerald-500 text-emerald-300' : syncStatus === "syncing" ? 'bg-amber-950/50 border-amber-500 text-amber-300' : syncStatus === "error" ? 'bg-rose-950/50 border-rose-500 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                    <i className={`fa-solid ${syncStatus === "syncing" ? 'fa-arrows-rotate animate-spin' : syncStatus === "synced" ? 'fa-cloud-arrow-up' : syncStatus === "error" ? 'fa-triangle-exclamation' : 'fa-cloud'}`}></i>
                                    {syncStatus === "syncing" ? "同步中" : syncStatus === "synced" ? "已同步" : syncStatus === "error" ? "同步异常" : "设备同步"}
                                </button>

                                {/* 统计看板按钮 */}
                                <button 
                                    onClick={() => setShowStatsModal(true)}
                                    className="px-3 py-1.5 bg-gradient-to-r from-cyan-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 rounded-xl text-xs text-white font-bold shadow-lg transition flex items-center gap-1.5 active:scale-95">
                                    <i className="fa-solid fa-chart-pie"></i>

                                    <i className="fa-solid fa-arrows-rotate text-cyan-400"></i>
                                    {testDirection === "EN_TO_CN" ? "看英想中" : "看中想英"}
                                </button>

                                {/* 自动发音 */}
                                <button

                            </div>
                        </div>

                        {/* 筛选控制面板 */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

                                <select

                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs text-slate-400 mb-1 font-semibold">目标筛选</label>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => { navigationSourceRef.current = "local"; setFilterMode("ALL"); setViewUpdatedAt(Date.now()); }}
                                        className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${filterMode === "ALL" ? 'bg-slate-700 border-cyan-500 text-cyan-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                        全量抽取
                                    </button>
                                    <button 
                                        onClick={() => { navigationSourceRef.current = "local"; setFilterMode("HARD"); setViewUpdatedAt(Date.now()); }}
                                        className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${filterMode === "HARD" ? 'bg-rose-950/40 border-rose-500 text-rose-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                        仅顽固词（≥2点 · {stats.stubbornCount}词）
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs text-slate-400 mb-1 font-semibold">快速检索单词</label>
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="输入英文搜索..." 
                                        value={searchQuery}
                                        onChange={(e) => { navigationSourceRef.current = "local"; setSearchQuery(e.target.value); }}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 pl-8"
                                    />
                                    <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-3 text-xs text-slate-500"></i>
                                    {searchQuery && (
                                        <button onClick={() => { navigationSourceRef.current = "local"; setSearchQuery(""); }} className="absolute right-2.5 top-2.5 text-xs text-slate-400 hover:text-white">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ... existing card rendering code ... */}
                    <div className="my-auto py-4">
                        {filteredWords.length > 0 && currentCard ? (
                            <div className="flex flex-col items-center">
                                <div className="w-full max-w-lg flex justify-between items-center mb-3 text-xs text-slate-400">
                                    <span>{currentCard.chapterName}</span>
                                    <span>进度: <strong className="text-cyan-400">{currentIndex + 1}</strong> / {filteredWords.length}</span>
                                    <div>{renderDots(currentCard)}</div>
                                </div>

                                {/* 3D 卡片区域 */}
                                <div 
                                    onClick={handleFlip}
                                    className="w-full max-w-lg h-72 perspective-1000 cursor-pointer group">
                                    <div className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                                        
                                        {/* 卡片正面 */}
                                        <div className="absolute w-full h-full bg-gradient-to-b from-slate-800 to-slate-850 border-2 border-slate-700 rounded-2xl p-6 flex flex-col justify-between items-center backface-hidden shadow-2xl group-hover:border-slate-600 transition">
                                            <div className="w-full flex justify-between items-center text-slate-500 text-xs">
                                                <span><i className="fa-solid fa-hand-pointer mr-1"></i>点击或空格翻面</span>
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); playWordSound(currentCard.audioText); }}
                                                    className="hover:text-cyan-400 transition p-1.5 bg-slate-700/50 hover:bg-slate-700 rounded-lg text-slate-300 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-volume-high text-cyan-400"></i>
                                                    <span className="text-[11px] font-semibold">重播标准英音</span>
                                                </button>
                                            </div>

                                            <div className="text-center my-auto">
                                                {testDirection === "EN_TO_CN" ? (
                                                    <div>
                                                        <h2 className="text-4xl font-black text-white tracking-wide mb-2 select-all">{currentCard.en}</h2>
                                                        <p className="text-sm text-cyan-400/80 font-mono">{currentCard.phonetic}</p>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <h2 className="text-2xl font-bold text-amber-300 leading-relaxed">{currentCard.cn}</h2>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="text-slate-500 text-xs">
                                                【1–2秒反应】在脑海中快速提取对应含义
                                            </div>
                                        </div>

                                        {/* 卡片背面 */}
                                        <div className="absolute w-full h-full bg-slate-800 border-2 border-cyan-500/50 rounded-2xl p-6 flex flex-col justify-between items-center backface-hidden rotate-y-180 shadow-2xl">
                                            <div className="w-full flex justify-between items-center text-slate-500 text-xs">
                                                <span className="text-cyan-400 font-semibold"><i className="fa-solid fa-eye mr-1"></i>答案解析</span>
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); playWordSound(currentCard.audioText); }}
                                                    className="hover:text-cyan-300 transition p-1.5 bg-cyan-950/60 rounded-lg text-cyan-400 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-volume-high"></i>
                                                    <span className="text-[11px]">朗读发音</span>
                                                </button>
                                            </div>

                                            <div className="text-center my-auto px-2">
                                                {testDirection === "EN_TO_CN" ? (
                                                    <div>
                                                        <h3 className="text-2xl md:text-3xl font-extrabold text-emerald-400 mb-3 tracking-wide leading-relaxed select-all">{currentCard.cn}</h3>
                                                        <p className="text-lg text-slate-200 font-semibold font-mono">{currentCard.en} <span className="text-xs text-cyan-400 font-normal ml-2">{currentCard.phonetic}</span></p>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <h2 className="text-4xl font-black text-white tracking-wide mb-2 select-all">{currentCard.en}</h2>
                                                        <p className="text-sm text-cyan-400 font-mono mb-3">{currentCard.phonetic}</p>
                                                        <p className="text-xl font-bold text-emerald-400 leading-relaxed">{currentCard.cn}</p>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="text-slate-400 text-xs">
                                                记录本轮反应：不认识加点，认识不减累计点
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                {/* 判定控制按钮 */}
                                {isAwaitingNext ? (
                                    <button
                                        onClick={advanceToNext}
                                        className="w-full max-w-lg mt-6 py-3 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 active:scale-95">
                                        <i className="fa-solid fa-arrow-right"></i>
                                        <div className="text-left">
                                            <div className="text-sm">看完释义，进入下一个词</div>
                                            <div className="text-[10px] text-cyan-900 font-normal">快捷键: Space / → / D</div>
                                        </div>
                                    </button>
                                ) : (
                                <div className="w-full max-w-lg mt-6 grid grid-cols-2 gap-4">
                                    <button 
                                        onClick={() => handleResult(false)}
                                        className="py-3 px-4 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 group active:scale-95">
                                        <i className="fa-solid fa-xmark text-lg group-hover:scale-110 transition"></i>
                                        <div className="text-left">
                                            <div className="text-sm">未想出来（+1点）</div>
                                            <div className="text-[10px] text-rose-200 font-normal">快捷键: ← / A</div>
                                        </div>
                                    </button>

                                    <button 
                                        onClick={() => handleResult(true)}
                                        className="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 group active:scale-95">
                                        <i className="fa-solid fa-check text-lg group-hover:scale-110 transition"></i>
                                        <div className="text-left">
                                            <div className="text-sm">1–2秒认识（不减点）</div>
                                            <div className="text-[10px] text-emerald-200 font-normal">快捷键: → / D</div>
                                        </div>
                                    </button>
                                </div>
                                )}
                            </div>
                        ) : (
                            <div className="text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-700 max-w-lg mx-auto">
                                <i className="fa-solid fa-trophy text-4xl text-amber-400 mb-3"></i>
                                <h3 className="text-xl font-bold text-white mb-2">太棒了！当前条件下的单词已全部通关！</h3>
                                <p className="text-sm text-slate-400 mb-4">当前单元没有不合规的生词，或搜索结果已全部刷完。</p>
                                <button 
                                    onClick={() => { navigationSourceRef.current = "local"; setSelectedChapter("ALL"); setFilterMode("ALL"); setSearchQuery(""); setViewUpdatedAt(Date.now()); }}
                                    className="px-4 py-2 bg-cyan-500 text-slate-950 font-bold rounded-xl text-sm hover:bg-cyan-400 transition">
                                    恢复全量测试
                                </button>
                            </div>

                    </div>

                    {/* 跨设备同步 Modal */}
                    {showSyncModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden animate-fadeIn">

                                        电脑、iPad、手机同步
                                    </h2>
                                    <button onClick={() => setShowSyncModal(false)} className="text-slate-400 hover:text-white p-1 rounded-lg">

                                </div>

                                        <div className="flex items-center gap-2 font-semibold">
                                            <i className={`fa-solid ${syncStatus === "syncing" ? 'fa-arrows-rotate animate-spin' : syncStatus === "synced" ? 'fa-circle-check' : syncStatus === "error" ? 'fa-circle-exclamation' : 'fa-circle-info'}`}></i>

                                                在 iPad 或手机打开同一网址，点击顶部“设备同步”，输入这个同步码。打点记录、当前章节和正在学习的单词都会自动合并。

                                                    <i className="fa-solid fa-rotate mr-1.5"></i>立即同步
                                                </button>
                                                <button onClick={handleDisconnectSync} className="py-2.5 bg-slate-800 border border-slate-700 hover:border-rose-600 text-slate-300 rounded-xl font-semibold">
                                                    解除本机同步
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            <div className="bg-slate-800/60 rounded-xl p-3 text-xs text-slate-300 leading-relaxed">
                                                第一次设置时，在已有学习记录的电脑上创建同步码；然后在 iPad、手机输入同一个码。无需登录 ChatGPT。
                                            </div>
                                            <button onClick={handleCreateSyncCode} className="w-full py-3 bg-gradient-to-r from-cyan-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 text-white rounded-xl font-bold shadow-lg">
                                                <i className="fa-solid fa-plus mr-1.5"></i>在这台设备创建同步码
                                            </button>
                                            <div className="flex items-center gap-3 text-xs text-slate-500">
                                                <div className="h-px bg-slate-700 flex-1"></div>
                                                或者输入已有同步码
                                                <div className="h-px bg-slate-700 flex-1"></div>
                                            </div>
                                            <input
                                                value={syncCodeInput}
                                                onChange={(event) => setSyncCodeInput(formatSyncCode(event.target.value).slice(0, 19))}
                                                onKeyDown={(event) => { if (event.key === "Enter") handleConnectSyncCode(); }}
                                                inputMode="text"
                                                autoCapitalize="characters"
                                                autoCorrect="off"
                                                spellCheck="false"
                                                placeholder="XXXX-XXXX-XXXX-XXXX"
                                                className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 rounded-xl px-3 py-3 text-center text-lg tracking-wider font-bold font-mono text-white outline-none"
                                            />
                                            <button onClick={handleConnectSyncCode} className="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold">
                                                连接并合并进度
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 打点统计看板 Modal */}
                    {showStatsModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-fadeIn">
                                {/* Header */}
                                <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-850">
                                    <h2 className="text-lg font-bold text-cyan-400 flex items-center gap-2">
                                        <i className="fa-solid fa-chart-line"></i>
                                        雅思词汇真经 · 记忆打点数据看板
                                    </h2>
                                    <button 
                                        onClick={() => setShowStatsModal(false)}
                                        className="text-slate-400 hover:text-white p-1 rounded-lg transition">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {/* Body */}
                                <div className="p-5 overflow-y-auto space-y-6 text-sm text-slate-300">
                                    {/* 核心指标卡片 */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        <div className="bg-slate-800/80 p-3 rounded-xl border border-emerald-500/30 text-center">
                                            <div className="text-xs text-slate-400">初识未测（0轮）</div>
                                            <div className="text-2xl font-black text-emerald-400 mt-1">{stats.unseen}</div>
                                            <div className="text-[10px] text-slate-500 mt-0.5">占比 {Math.round((stats.unseen/stats.total)*100)}%</div>
                                        </div>
                                        <div className="bg-slate-800/80 p-3 rounded-xl border border-amber-500/30 text-center">
                                            <div className="text-xs text-slate-400">当前掌握（连认3轮）</div>
                                            <div className="text-2xl font-black text-amber-400 mt-1">{stats.mastered}</div>
                                            <div className="text-[10px] text-slate-500 mt-0.5">占比 {Math.round((stats.mastered/stats.total)*100)}%</div>
                                        </div>
                                        <div className="bg-slate-800/80 p-3 rounded-xl border border-rose-500/30 text-center">
                                            <div className="text-xs text-slate-400">顽固词（≥2点）</div>
                                            <div className="text-2xl font-black text-rose-400 mt-1">{stats.stubbornCount}</div>
                                            <div className="text-[10px] text-slate-500 mt-0.5">占比 {Math.round((stats.stubbornCount/stats.total)*100)}%</div>
                                        </div>
                                        <div className="bg-slate-800/80 p-3 rounded-xl border border-purple-500/30 text-center">
                                            <div className="text-xs text-slate-400">重度顽固（≥5点）</div>
                                            <div className="text-2xl font-black text-purple-400 mt-1">{stats.dotBuckets.heavy}</div>
                                            <div className="text-[10px] text-slate-500 mt-0.5">历史累计 {stats.totalDots}点</div>
                                        </div>
                                    </div>

                                    {/* 本次特训统计 */}
                                    <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                                        <div>
                                            <div className="text-xs font-semibold text-slate-400">本次特训表现</div>
                                            <div className="text-sm font-bold text-slate-200 mt-1">
                                                已刷 {sessionStats.total} 词 | 本次认识率: <span className="text-cyan-400">{sessionStats.total > 0 ? Math.round((sessionStats.correct / sessionStats.total)*100) : 0}%</span>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-xs text-slate-400">总掌握率</div>
                                            <div className="text-xl font-black text-cyan-400">{stats.masteryPercent}%</div>
                                        </div>
                                    </div>

                                    {/* 全书进度总条 */}
                                    <div>
                                        <div className="flex justify-between text-xs mb-1 font-semibold">
                                            <span>全书 3,673 词当前掌握进度</span>
                                            <span className="text-emerald-400">{stats.mastered} / {stats.total} 连续认识3轮</span>
                                        </div>
                                        <div className="w-full h-3 bg-slate-800 rounded-full overflow-hidden">
                                            <div style={{ width: `${stats.masteryPercent}%` }} className="bg-emerald-500 h-full" title="连续3轮认识"></div>
                                        </div>
                                    </div>

                                    {/* 22章节具体通关完成率列表 */}
                                    <div>
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">全 22 章节通关掌握率明细</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-56 overflow-y-auto pr-1">
                                            {stats.chapterStats.map(ch => (
                                                <div key={ch.id} className="p-2 bg-slate-800/40 rounded-lg border border-slate-700/60 flex items-center justify-between text-xs">
                                                    <span className="truncate max-w-[150px] text-slate-300 font-medium">{ch.name}</span>
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                                            <div className="bg-cyan-400 h-full" style={{ width: `${ch.percent}%` }}></div>
                                                        </div>
                                                        <span className="w-9 text-right text-slate-400 font-mono">{ch.percent}%</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Footer */}
                                <div className="p-4 border-t border-slate-800 bg-slate-850 flex justify-between items-center">
                                    <button 
                                        onClick={handleResetProgress}
                                        className="px-3 py-1.5 bg-rose-950/40 border border-rose-800 hover:bg-rose-900/60 text-rose-300 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                                        <i className="fa-solid fa-trash-can"></i>
                                        重置打点数据
                                    </button>

                                    <button 
                                        onClick={() => setShowStatsModal(false)}
                                        className="px-4 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold rounded-xl transition">
                                        返回特训
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 页脚说明 */}
                    <div className="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-500 flex flex-wrap justify-between items-center gap-2">
                        <span>💡 键盘快捷极速盲打: <kbd>Space</kbd> 翻牌 | <kbd>←</kbd> 加1点 | <kbd>→</kbd> 认识（不减点） | <kbd>↑</kbd> 听发音</span>
                        <span>释义: 人工校订 + ECDICT | 发音: 有道英音 + 系统语音回退</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<FlashcardApp />);
    </script>
</body>
</html>
